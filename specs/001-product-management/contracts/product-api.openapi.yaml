openapi: 3.0.3
info:
  title: 커머스 상품 관리 API
  version: 1.0.0
  description: |
    운영자용 상품 관리 API. 모든 엔드포인트는 `PRODUCT_MANAGER` 역할이 필요하다.
    오류 응답은 Problem Details(RFC 9457) 형식이며 `detail`은 조치 가능한 한글 메시지다.
servers:
  - url: /api/v1
security:
  - basicAuth: []
  - bearerAuth: []
tags:
  - name: storefront
    description: 고객 노출용 읽기 전용 조회(인증 불필요)
  - name: products
    description: 상품 등록·조회·수정·삭제
  - name: images
    description: 상품 이미지
  - name: categories
    description: 카테고리 조회
paths:
  /products:
    get:
      tags: [products]
      summary: 상품 목록 조회 (검색·필터·정렬·페이지)
      operationId: listProducts
      parameters:
        - { name: q, in: query, description: 상품명 부분 일치 검색어, schema: { type: string, maxLength: 200 } }
        - { name: categoryId, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ProductStatus' } }
        - name: sort
          in: query
          description: 정렬 기준. 기본값은 등록일 내림차순
          schema:
            type: string
            enum: ["createdAt,desc", "createdAt,asc", "price,desc", "price,asc"]
            default: "createdAt,desc"
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 조건에 맞는 상품 페이지. 결과가 없으면 `content`가 빈 배열이다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [products]
      summary: 상품 등록
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreateRequest' }
      responses:
        '201':
          description: 등록됨
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 상품 코드 중복
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /products/{productId}:
    parameters:
      - { name: productId, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [products]
      summary: 상품 상세 조회
      operationId: getProduct
      responses:
        '200':
          description: 상품 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [products]
      summary: 상품 수정 (상품 코드는 변경할 수 없다)
      operationId: updateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdateRequest' }
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 다른 운영자가 먼저 저장함. 최신 내용을 다시 불러와야 한다
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [products]
      summary: 상품 삭제 (논리 삭제)
      description: 확인 절차는 클라이언트 화면에서 거친다. 서버는 삭제 표시만 하고 데이터를 보존한다.
      operationId: deleteProduct
      responses:
        '204': { description: 삭제 표시됨 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /products/{productId}/images:
    parameters:
      - { name: productId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [images]
      summary: 이미지 업로드 (JPG·PNG, 장당 5MB 이하, 상품당 10장 이하)
      operationId: uploadProductImage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: 업로드됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductImage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: 파일이 5MB를 초과함
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /products/{productId}/images/{imageId}:
    parameters:
      - { name: productId, in: path, required: true, schema: { type: integer, format: int64 } }
      - { name: imageId, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      tags: [images]
      summary: 이미지 삭제 (대표 이미지를 삭제하면 남은 첫 이미지가 대표가 된다)
      operationId: deleteProductImage
      responses:
        '204': { description: 삭제됨 }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /products/{productId}/images/{imageId}/primary:
    parameters:
      - { name: productId, in: path, required: true, schema: { type: integer, format: int64 } }
      - { name: imageId, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      tags: [images]
      summary: 대표 이미지로 지정
      operationId: setPrimaryImage
      responses:
        '204': { description: 지정됨 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /images/{storageKey}:
    parameters:
      - { name: storageKey, in: path, required: true, schema: { type: string } }
    get:
      tags: [images]
      summary: 이미지 파일 조회 (인증 불필요)
      description: 고객 화면에서도 표시해야 하므로 인증 없이 읽을 수 있다. 삭제된 상품의 이미지는 404를 반환한다. 숨김 상품의 이미지는 추측하기 어려운 키를 아는 경우에만 읽을 수 있다.
      operationId: getImageFile
      security: []
      responses:
        '200':
          description: 이미지 파일(저장된 content type으로 응답)
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }
  /storefront/products:
    get:
      tags: [storefront]
      summary: 고객 노출용 상품 목록 (판매중·품절만, 숨김·삭제 제외)
      operationId: listStorefrontProducts
      security: []
      parameters:
        - { name: categoryId, in: query, schema: { type: integer, format: int64 } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 노출 가능한 상품 페이지
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorefrontProductPage' }
  /storefront/products/{productId}:
    parameters:
      - { name: productId, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [storefront]
      summary: 고객 노출용 상품 상세 (숨김·삭제된 상품은 404)
      operationId: getStorefrontProduct
      security: []
      responses:
        '200':
          description: 고객 노출용 상품 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorefrontProduct' }
        '404': { $ref: '#/components/responses/NotFound' }
  /categories:
    get:
      tags: [categories]
      summary: 카테고리 목록 조회
      operationId: listCategories
      responses:
        '200':
          description: 카테고리 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: 개발·테스트 프로필 전용. 인메모리 PRODUCT_MANAGER 계정으로 인증한다.
    bearerAuth:
      type: http
      scheme: bearer
      description: 운영 환경용. 인증 방식의 상세는 별도 기능에서 정한다. 이 API는 PRODUCT_MANAGER 역할만 확인한다.
  schemas:
    StorefrontVariant:
      type: object
      required: [optionValues, soldOut]
      description: 옵션 조합과 품절 여부. 정확한 재고 수량은 노출하지 않는다.
      properties:
        optionValues:
          type: object
          additionalProperties: { type: string }
        soldOut: { type: boolean }
    StorefrontProduct:
      type: object
      required: [id, name, price, categoryId, soldOut]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string, nullable: true }
        price: { type: integer, format: int64 }
        categoryId: { type: integer, format: int64 }
        soldOut: { type: boolean }
        optionGroups:
          type: array
          items: { $ref: '#/components/schemas/OptionGroup' }
        variants:
          type: array
          items: { $ref: '#/components/schemas/StorefrontVariant' }
        images:
          type: array
          items: { $ref: '#/components/schemas/ProductImage' }
    StorefrontProductPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/StorefrontProduct' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    ProductStatus:
      type: string
      enum: [ON_SALE, SOLD_OUT, HIDDEN]
      description: 판매중, 품절, 숨김. 운영자는 ON_SALE과 HIDDEN만 지정할 수 있고 SOLD_OUT은 재고로 결정된다.
    OptionGroup:
      type: object
      required: [name, values]
      properties:
        name: { type: string, maxLength: 50, example: 색상 }
        values:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, maxLength: 50 }
          example: [빨강, 파랑]
    Variant:
      type: object
      required: [optionValues, stockQuantity]
      description: 옵션 값 조합과 그 재고. 같은 조합은 중복될 수 없다.
      properties:
        optionValues:
          type: object
          additionalProperties: { type: string }
          example: { 색상: 빨강, 사이즈: M }
        stockQuantity: { type: integer, minimum: 0 }
    ProductImage:
      type: object
      required: [id, url, primary, position]
      properties:
        id: { type: integer, format: int64 }
        url: { type: string }
        primary: { type: boolean }
        position: { type: integer }
    ProductWriteFields:
      type: object
      required: [name, price, categoryId]
      # allOf로 합성하는 스키마이므로 다른 구성 요소의 속성을 허용한다.
      additionalProperties: true
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, nullable: true }
        price: { type: integer, format: int64, minimum: 1, description: 원화 정수 }
        categoryId: { type: integer, format: int64 }
        status:
          type: string
          enum: [ON_SALE, HIDDEN]
          default: ON_SALE
        stockQuantity:
          type: integer
          minimum: 0
          description: 옵션이 없는 상품의 재고. 옵션이 있으면 지정하지 않는다
        optionGroups:
          type: array
          items: { $ref: '#/components/schemas/OptionGroup' }
        variants:
          type: array
          description: 옵션이 있는 상품은 모든 옵션 값 조합을 빠짐없이 포함해야 한다
          items: { $ref: '#/components/schemas/Variant' }
    ProductCreateRequest:
      allOf:
        - $ref: '#/components/schemas/ProductWriteFields'
        - type: object
          additionalProperties: true
          properties:
            code:
              type: string
              pattern: '^[A-Z0-9-]{3,30}$'
              description: 비우면 자동 생성된다. 직접 입력하면 중복 검사를 거친다
    ProductUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/ProductWriteFields'
        - type: object
          additionalProperties: true
          required: [version]
          properties:
            version:
              type: integer
              format: int64
              description: 편집을 시작할 때 받은 버전. 서버의 최신 버전과 다르면 409를 반환한다
    Product:
      type: object
      required: [id, code, name, price, categoryId, status, version, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        price: { type: integer, format: int64 }
        categoryId: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/ProductStatus' }
        stockQuantity: { type: integer, nullable: true }
        optionGroups:
          type: array
          items: { $ref: '#/components/schemas/OptionGroup' }
        variants:
          type: array
          items: { $ref: '#/components/schemas/Variant' }
        images:
          type: array
          items: { $ref: '#/components/schemas/ProductImage' }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProductSummary:
      type: object
      required: [id, code, name, price, status, createdAt]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        price: { type: integer, format: int64 }
        categoryId: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/ProductStatus' }
        totalStock: { type: integer }
        primaryImageUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    ProductPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/ProductSummary' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    Category:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    Problem:
      type: object
      required: [title, status, detail]
      properties:
        type: { type: string, description: 오류 유형 URI. 별도 정의가 없으면 about:blank }
        instance: { type: string, description: 오류가 발생한 요청 경로 }
        title: { type: string }
        status: { type: integer }
        detail: { type: string, description: 조치 가능한 한글 안내 메시지 }
        requestId: { type: string }
        errors:
          type: array
          description: 검증 실패 항목(필드별)
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
  responses:
    ValidationError:
      description: 입력 검증 실패. `errors`에 누락·잘못된 항목이 담긴다
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: 인증되지 않음
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: 권한 없음(PRODUCT_MANAGER 역할 필요)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: 존재하지 않거나 삭제된 상품
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
